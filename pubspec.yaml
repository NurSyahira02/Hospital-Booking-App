name: hello_flutter
description: "Hospital Booking App"
publish_to: 'none' # Remove this if you want to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  uuid: ^4.2.2
  sqflite: ^2.3.2+1
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.3
  cupertino_icons: ^1.0.8
  intl: ^0.18.1

  # 🔐 For password hashing
  crypto: ^3.0.3

  # 🖼️ For image selection (profile picture)
  image_picker: ^1.0.4

  # 🌟 For star rating in feedback
  flutter_rating_bar: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
