name: hello_flutter
description: "Hospital Booking App"
publish_to: 'none' # Remove this if you want to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '^3.7.0'

dependencies:
  flutter:
    sdk: flutter

  # 🧠 State management
  provider: ^6.1.2

  # 📦 Database
  sqflite: ^2.3.2+1
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.3

  # 📄 UUID for IDs
  uuid: ^4.2.2

  # 🧠 Remember login email & theme
  shared_preferences: ^2.2.2

  # 🔐 For password hashing
  crypto: ^3.0.3

  # 🌐 Localization & internationalization
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter

  # 🌟 Feedback rating bar
  flutter_rating_bar: ^4.0.1

  # 🖼️ Image picker for profile
  image_picker: ^1.0.4

  # 🔔 Local notifications
  flutter_local_notifications: ^17.1.2

  # 🕒 Timezone support for notifications
  timezone: ^0.9.2

  # 🎨 UI
  cupertino_icons: ^1.0.8

flutter:
  uses-material-design: true
  generate: true  # ✅ Required for localization to work

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
